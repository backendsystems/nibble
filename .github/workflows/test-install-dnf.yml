name: Test Install via dnf (COPR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (for example v1.2.3)
        required: true
        type: string

jobs:
  dnf-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: ubuntu-24.04
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    container:
      image: fedora:latest
    steps:
      - name: Install nibble with dnf
        run: |
          TAG='${{ inputs.tag }}'
          VERSION="${TAG#v}"
          dnf install -y 'dnf-command(copr)'
          dnf copr enable -y @backendsystems/nibble
          dnf install -y nibble-${VERSION}

      - name: Smoke test nibble startup
        uses: backendsystems/nibble/.github/actions/smoke-test@main

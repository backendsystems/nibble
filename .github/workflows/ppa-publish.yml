name: PPA Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true
        type: string

jobs:
  ppa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        series: [noble, jammy, questing]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Vendor Go modules
        run: go mod vendor

      - name: Install packaging tools
        run: sudo apt-get install -y devscripts debhelper build-essential dput gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.PPA_GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Update debian/changelog
        run: |
          DEBEMAIL="mail@saberd.com"
          DEBFULLNAME="saberd"
          export DEBEMAIL DEBFULLNAME
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          dch --newversion "${VERSION}-1~${{ matrix.series }}" \
              --distribution "${{ matrix.series }}" \
              --force-distribution \
              "Release ${{ github.event.inputs.version }}"

      - name: Build source package
        run: debuild -S -sa -d -k"$GPG_KEY_ID"

      - name: Upload to PPA
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          dput ppa:backendsystems/ppa ../nibble_${VERSION}-1~${{ matrix.series }}_source.changes

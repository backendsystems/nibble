name: PPA Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. v0.1.0)
        required: true
        type: string
      revision:
        description: Debian revision (default 1)
        required: false
        default: '1'
        type: string
      upload:
        description: Upload to PPA
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Determine git ref
        id: ref
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" == v* ]]; then
            echo "ref=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Download release binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p prebuilt
          gh release download "v${VERSION}" -p "nibble_linux_amd64.tar.gz"
          gh release download "v${VERSION}" -p "nibble_linux_arm64.tar.gz"
          tar -xzf nibble_linux_amd64.tar.gz nibble
          mv nibble prebuilt/nibble_linux_amd64
          tar -xzf nibble_linux_arm64.tar.gz nibble
          mv nibble prebuilt/nibble_linux_arm64
          chmod +x prebuilt/nibble_linux_*
          rm -f nibble_linux_*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create orig tarball with prebuilt binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd ..
          tar --exclude=nibble/.git \
              --exclude=nibble/.github \
              --exclude=nibble/debian \
              --transform="s,^nibble,nibble-${VERSION}," \
              -czf nibble_${VERSION}.orig.tar.gz nibble

      - name: Upload orig tarball
        uses: actions/upload-artifact@v4
        with:
          name: orig-tarball
          path: ../nibble_${{ steps.version.outputs.version }}.orig.tar.gz
          retention-days: 1

  ppa:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        series: [noble, jammy, questing]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download release binaries
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p prebuilt
          gh release download "v${VERSION}" -p "nibble_linux_amd64.tar.gz"
          gh release download "v${VERSION}" -p "nibble_linux_arm64.tar.gz"
          tar -xzf nibble_linux_amd64.tar.gz nibble
          mv nibble prebuilt/nibble_linux_amd64
          tar -xzf nibble_linux_arm64.tar.gz nibble
          mv nibble prebuilt/nibble_linux_arm64
          chmod +x prebuilt/nibble_linux_*
          rm -f nibble_linux_*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download orig tarball
        uses: actions/download-artifact@v4
        with:
          name: orig-tarball
          path: ../

      - name: Ensure debian/source files exist
        run: |
          mkdir -p debian/source
          if [ ! -f debian/source/format ]; then
            echo "3.0 (quilt)" > debian/source/format
          fi
          if [ ! -f debian/source/options ]; then
            cat > debian/source/options << 'EOF'
          extend-diff-ignore = "^\.git/"
          extend-diff-ignore = "^\.github/"
          EOF
          fi

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y devscripts debhelper build-essential dput gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.PPA_GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Update debian/changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REVISION="${{ github.event.inputs.revision }}"
          DEBEMAIL="mail@saberd.com"
          DEBFULLNAME="saberd"
          export DEBEMAIL DEBFULLNAME
          dch --newversion "${VERSION}-${REVISION}~${{ matrix.series }}" \
              --distribution "${{ matrix.series }}" \
              --force-distribution \
              "Release ${VERSION}"

      - name: Build source package
        run: debuild -S -d -k"$GPG_KEY_ID"

      - name: Upload to PPA
        if: ${{ github.event.inputs.upload == 'true' }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REVISION="${{ github.event.inputs.revision }}"
          dput ppa:backendsystems/ppa ../nibble_${VERSION}-${REVISION}~${{ matrix.series }}_source.changes

      - name: Copy artifacts to current directory
        if: ${{ github.event.inputs.upload != 'true' }}
        run: cp ../*.{dsc,tar.gz,changes,buildinfo} . 2>/dev/null || true

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ppa-source-${{ matrix.series }}
          path: |
            *.dsc
            *.tar.gz
            *.changes
            *.buildinfo
          retention-days: 7

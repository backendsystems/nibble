name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref for dry run (default main)
        required: false
        default: main
        type: string
      tag:
        description: Tag label for dry run metadata (for example v0.1.0)
        required: true
        type: string
      dry_run:
        description: Run GoReleaser in snapshot mode (no GitHub release)
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            CHECKOUT_REF="${{ github.ref }}"
          else
            TAG="${{ github.event.inputs.tag }}"
            CHECKOUT_REF="${{ github.event.inputs.ref }}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Expected a tag starting with 'v', got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Create local tag for dry run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: git tag -f "${{ steps.vars.outputs.tag }}"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Enforce dry-run for manual execution
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "workflow_dispatch only supports dry-run mode. Use a pushed v* tag for real release."
          exit 1
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  brew:
    if: ${{ github.event_name == 'push' }}
    needs: release
    runs-on: ubuntu-latest
    environment: brew
    steps:
      - name: Mark Homebrew publish complete
        run: echo "Homebrew cask is published by GoReleaser in the release job."

  ppa:
    if: ${{ github.event_name == 'push' }}
    needs: release
    uses: ./.github/workflows/ppa-publish.yml
    with:
      version: ${{ github.ref_name }}
      revision: '1'
      upload: true
    secrets:
      PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}

  winget:
    if: ${{ github.event_name == 'push' }}
    needs: release
    uses: ./.github/workflows/winget-publish.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  copr:
    if: ${{ github.event_name == 'push' }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Vendor Go modules
        run: go mod vendor

      - name: Install copr-cli and rpm tools
        run: |
          sudo apt-get install -y python3-pip rpm
          pip3 install copr-cli

      - name: Configure copr-cli
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = backendsystems
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Update spec version
        run: |
          sed -i "s/^Version:.*/Version:        ${{ steps.version.outputs.version }}/" fedora/nibble.spec
          sed -i "s/^- Initial release/- Release ${{ steps.version.outputs.version }}/" fedora/nibble.spec

      - name: Create source tarball and srpm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          mkdir -p nibble-${VERSION}
          rsync -a --exclude=".git" --exclude="nibble-${VERSION}" . nibble-${VERSION}/
          tar czf ~/rpmbuild/SOURCES/nibble-${VERSION}.tar.gz nibble-${VERSION}/
          rm -rf nibble-${VERSION}/
          cp fedora/nibble.spec ~/rpmbuild/SPECS/nibble.spec
          rpmbuild -bs ~/rpmbuild/SPECS/nibble.spec

      - name: Upload srpm to COPR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRPM=$(ls ~/rpmbuild/SRPMS/nibble-${VERSION}*.src.rpm)
          copr-cli build @backendsystems/nibble "$SRPM" --nowait

name: Test Install via npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (for example v1.2.3)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Strip v prefix
        id: v
        shell: bash
        run: |
          TAG='${{ inputs.tag }}'
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  npm-global-install:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: x64
            runs_on: ubuntu-24.04
          - os: ubuntu
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runs_on: windows-2022
          - os: windows
            arch: arm64
            runs_on: windows-11-arm
          - os: macos
            arch: x64
            runs_on: macos-15-intel
          - os: macos
            arch: arm64
            runs_on: macos-15
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}

      - name: Install nibble with npm -g
        run: npm install -g @backendsystems/nibble@${{ needs.resolve-version.outputs.version }}

      - name: Show installed npm package version
        run: npm list -g @backendsystems/nibble --depth=0

      - name: Smoke test nibble startup
        uses: backendsystems/nibble/.github/actions/smoke-test@main

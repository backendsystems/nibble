name: Test Install via pipx

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (for example v1.2.3)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Strip v prefix
        id: v
        shell: bash
        run: |
          TAG='${{ inputs.tag }}'
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  pipx-install:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: x64
            runs_on: ubuntu-24.04
          - os: ubuntu
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runs_on: windows-2022
          - os: windows
            arch: arm64
            runs_on: windows-11-arm
          - os: macos
            arch: x64
            runs_on: macos-15-intel
          - os: macos
            arch: arm64
            runs_on: macos-15
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Install nibble with pipx
        run: pipx install nibble-cli==${{ needs.resolve-version.outputs.version }}

      - name: Smoke test nibble startup
        uses: backendsystems/nibble/.github/actions/smoke-test@main
